name: Test and publish Docker images

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  API_IMAGE: meinya/sparkle-api
  NEXT_IMAGE: meinya/sparkle-next

jobs:
  backend:
    name: Go tests and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Test with race detection
        working-directory: backend
        run: go test -race -count=1 ./...
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Validate workflow and shell script
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck scripts/ci/docker-smoke.sh

  frontend:
    name: TypeScript and player tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: npm
      - run: npm ci
      - name: Generate Next.js types
        run: npx next typegen
      - run: npm run check
      - run: npm run test:player

  images:
    name: Build, smoke-test and publish both images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      api-digest: ${{ steps.publish.outputs.api-digest }}
      next-digest: ${{ steps.publish.outputs.next-digest }}
    env:
      LOCAL_API_IMAGE: sparkle-api-ci:${{ github.sha }}
      LOCAL_NEXT_IMAGE: sparkle-next-ci:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: npm
      - name: Image version
        id: version
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build API
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_API_IMAGE }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_VERSION=${{ steps.version.outputs.short }}
          cache-from: type=gha,scope=sparkle-api-amd64
          cache-to: type=gha,mode=max,scope=sparkle-api-amd64
      - name: Build frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.LOCAL_NEXT_IMAGE }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_VERSION=${{ steps.version.outputs.short }}
          cache-from: type=gha,scope=sparkle-next-amd64
          cache-to: type=gha,mode=max,scope=sparkle-next-amd64
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chrome
      - name: Smoke-test images together and run browser regressions
        run: bash scripts/ci/docker-smoke.sh
      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-${{ github.run_attempt }}
          path: cache/playwright-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested images with commit tags
        id: publish
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.version.outputs.short }}
        run: |
          publish() {
            local image="$1" local_image="$2" output="$3" reference digest
            docker tag "$local_image" "$image:$VERSION"
            docker push "$image:$VERSION"
            reference="$(docker image inspect "$image:$VERSION" --format '{{index .RepoDigests 0}}')"
            digest="${reference##*@}"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo '::error::Published image digest could not be verified.'
              exit 1
            fi
            echo "$output=$digest" >> "$GITHUB_OUTPUT"
            echo "Published $image:$VERSION ($digest)." >> "$GITHUB_STEP_SUMMARY"
          }
          publish "$API_IMAGE" "$LOCAL_API_IMAGE" api-digest
          publish "$NEXT_IMAGE" "$LOCAL_NEXT_IMAGE" next-digest

  latest:
    name: Update default-branch latest tags
    needs: images
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: dockerhub-latest
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Promote only the current default-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_SHA: ${{ github.sha }}
          API_DIGEST: ${{ needs.images.outputs.api-digest }}
          NEXT_DIGEST: ${{ needs.images.outputs.next-digest }}
        run: |
          head_sha="$(gh api "repos/$GH_REPO/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha')"
          if [[ "$head_sha" != "$EXPECTED_SHA" ]]; then
            echo '::notice::Default branch advanced; keeping these images under their commit tags only.'
            echo 'Skipped latest: this commit is no longer the default-branch head.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --prefer-index=false --tag "$API_IMAGE:latest" "$API_IMAGE@$API_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$NEXT_IMAGE:latest" "$NEXT_IMAGE@$NEXT_DIGEST"
          echo "Updated both latest tags from $EXPECTED_SHA." >> "$GITHUB_STEP_SUMMARY"
