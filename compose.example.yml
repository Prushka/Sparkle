services:
  sparkle-api:
    image: meinya/sparkle-api:latest
    restart: unless-stopped
    environment:
      ADDR: :1323
      OUTPUT: /data/output
      JOBS_CACHE_TTL: 15m
      MAX_PFP_BYTES: '12000000'
      PFP_DIR: /data/pfp
      MEDIA_CACHE_DIR: /cache/media
      PLEX_URL: ${PLEX_URL}
      PLEX_TOKEN: ${PLEX_TOKEN}
      PLEX_AUTH_ORIGINS: ${PLEX_AUTH_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      PLEX_AUTH_COOKIE_SECURE: ${PLEX_AUTH_COOKIE_SECURE:-true}
      PLEX_AUTH_COOKIE_SAMESITE: ${PLEX_AUTH_COOKIE_SAMESITE:-lax}
      PLEX_LIBRARY_IDS: ${PLEX_LIBRARY_IDS}
      PLEX_PATH_MAPPINGS: '[{"plex":"/data/Managed-Videos","local":"/media/Managed-Videos"}]'
    ports:
      - '1323:1323'
    volumes:
      - ./output:/data/output:ro
      - ${PLEX_MEDIA_HOST_ROOT:-/mnt/Managed-Videos}:/media/Managed-Videos:ro
      - ./data/pfp:/data/pfp
      - ./cache/media:/cache/media

  sparkle-next:
    image: meinya/sparkle-next:latest
    restart: unless-stopped
    depends_on:
      - sparkle-api
    environment:
      SERVER_BE: /be
      SERVER_STATIC: /static
      SERVER_INTERNAL_BE: http://sparkle-api:1323
      SERVER_INTERNAL_STATIC: http://sparkle-api:1323/static
      PUBLIC_DISCORD_CLIENT_ID: ${PUBLIC_DISCORD_CLIENT_ID:-}
      SERVER_DISCORD_CLIENT_SECRET: ${SERVER_DISCORD_CLIENT_SECRET:-}
    ports:
      - '3000:3000'
