# Requires NVIDIA Container Toolkit on the Docker host.
# docker compose -f compose.example.yml -f compose.nvidia.yml up -d
services:
  sparkle-api:
    environment:
      ENCODE_ENABLED: 'true'
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility,graphics
      ENCODE_QUALITY: ${ENCODE_QUALITY:-24}
      ENCODE_PRESET: ${ENCODE_PRESET:-p3}
      ENCODE_AUDIO_SURROUND_KBPS_PER_CHANNEL: ${ENCODE_AUDIO_SURROUND_KBPS_PER_CHANNEL:-80}
      ENCODE_CONCURRENCY: ${ENCODE_CONCURRENCY:-2}
      ENCODE_CACHE_BYTES: ${ENCODE_CACHE_BYTES:-42949672960}
      ENCODE_CACHE_TTL: ${ENCODE_CACHE_TTL:-12h}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
